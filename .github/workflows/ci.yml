name: CI — Build & Lint Gate

on:
  pull_request:
    branches:
      - main   # Only gate PRs going INTO production
  push:
    branches:
      - dev    # Also run on every push to dev so failures are caught early

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build (type-check + Next.js compile)
        run: npm run build
        env:
          # Dummy env vars so Next.js build doesn't crash on missing secrets.
          # Real values live in Vercel — not needed at build-check time.
          MONGODB_URI: ${{ secrets.MONGODB_URI_QA || 'mongodb://localhost:27017/snt_ci' }}
          EMAIL_HOST: smtp.example.com
          EMAIL_PORT: '465'
          EMAIL_USER: ci@example.com
          EMAIL_PASS: ci_pass
          CRON_SECRET: ci_secret
